<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Flask Notes</title>\n    <link rel="stylesheet" href="static/style.css">\n</head>\n<body>\n    <h1>Hello, World!</h1>\n    <form action="/notes" method="post">\n        <input type="text" name="title" placeholder="Note Title" required>\n        <textarea name="content" placeholder="Note Content" required></textarea>\n        <button type="submit">Create Note</button>\n    </form>\n    <div class="notes">\n        {% for note in notes %} \n            <div class="note-card">\n                <h2>{{ note[0] }}</h2>\n                <p>{{ note[1] }}</p>\n                <small>Created at: {{ note[2] }}</small>\n                <form action="/notes/{{ loop.index0 + 1 }}/pin" method="post">\n                    <button type="submit">{% if note[3] %}Unpin{% else %}Pin{% endif %}</button>\n                </form>\n                <a href="/notes/{{ loop.index0 + 1 }}/edit">Edit</a>\n            </div>\n        {% endfor %} \n    </div>\n</body>\n</html>
