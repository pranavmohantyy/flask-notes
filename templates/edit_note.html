<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Edit Note</title>\n</head>\n<body>\n    <h1>Edit Note</h1>\n    <form action="/notes/{{ id }}/edit" method="post">\n        <input type="text" name="title" value="{{ note[0] }}" required>\n        <textarea name="content" required>{{ note[1] }}</textarea>\n        <button type="submit">Update Note</button>\n    </form>\n    <a href="/">Cancel</a>\n</body>\n</html>
